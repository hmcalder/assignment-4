This file is the HTML for a website that pulls from TVmaze to search and find different tv shows.

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Show Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!--Titles of the movies-->
    <header>
        <h1>Show Gallery</h1>
        <p>Searching all of your favorite shows!!!</p>
    </header>


    <!--The box and button-->
    <form id="search-form">
        <input type="text" id="search-input" placeholder="Enter a tv show please">
        <button type="submit" >Click to Search Shows</button>
    </form>

    <!--replace these with javaScript-->
    <p  id="message"></p>
    <div id="gallery"></div>

    <!--Using a footer to give credit to TVmaze-->
    <footer>
        <p>
            Show information is provided by TVmaze.
            Visit the website at: <a href="https://www.tvmaze.com/shows">TVmaze website</a>
        </p>
    </footer>



</body>

</html>
